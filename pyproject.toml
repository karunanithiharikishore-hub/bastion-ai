[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-ai"
version = "0.13.0"
description = "Blue-Team Log Intelligence — read-only multi-agent log analysis, ATT&CK mapping, RCA storyline, and IOC/threat-hunt generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harikishore Karunanithi" }]
keywords = ["security", "blue-team", "siem", "mitre-attack", "dfir", "threat-hunting"]
dependencies = []  # stdlib-only core

[project.optional-dependencies]
api = []   # kept so `bastion-ai[api]` still installs; the API path is stdlib urllib
dev = ["pytest>=7"]

[project.scripts]
bastion = "bastion.cli:main"
bluecell = "bastion.cli:main"   # old command name keeps working

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bastion = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
